# Copy this file to config.local.toml (git-ignored) and fill in your own values.
# Anything here overrides config.toml. Never put a password in this file.

[run]
# source = "oracle"            # uncomment to make the warehouse the default source

[oracle]
dsn  = "db-host.company.local:1521/SERVICE_NAME"   # host:port/service_name from the DBA
user = "READONLY_USER"

[email]
# How step 16 sends the alerts email from this machine.
#   "preview" = write data/real/reports/alert_email_preview.html only (default)
#   "graph"   = Microsoft 365 through Microsoft Graph (the server)
#   "outlook" = your own Outlook desktop app (testing on a laptop)
method   = "preview"
test_to  = "you@company.com"        # python pipeline/16_email_alerts.py --to-me
admin_to = []                       # who gets "pipeline run failed"
report_url = "http://reportserver.company.local/Reports/powerbi/Aman%20Prediction"   # "Open the report" link
# For method = "graph": the app registration in Microsoft Entra (Azure). The client secret is
# never stored here: keep it in Windows Credential Manager (see pipeline/16_email_alerts.py).
# tenant_id = "00000000-0000-0000-0000-000000000000"
# client_id = "00000000-0000-0000-0000-000000000000"
# sender    = "aman-alerts@company.com"

# [profiles.oracle]
# output_root = "D:/AmanPrediction/real"           # e.g. a different disk or a shared folder
