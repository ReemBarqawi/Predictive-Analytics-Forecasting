# Aman Prediction — pipeline configuration (committed; contains NO secrets)
#
# Personal / machine settings (Oracle address, username, a different output folder) go in
# config.local.toml next to this file. That file is git-ignored and overrides anything here.
# Copy config.local.example.toml to config.local.toml to start.
#
# Choose the data source per run:   python run_all.py --source oracle
# or set it here once:               [run] source = "oracle"

[run]
source = "oracle"             # "oracle" (company warehouse) or "synthetic" (demo Excel files)

# Where each source writes its results. Power BI's DataFolder parameter must point at
# <output_root>\ (the folder that contains 02_facts and 03_dims).
[profiles.synthetic]
output_root = "SYNTHETIC_DSS_DATA"
models_dir  = "models"
reports_dir = "outputs"
# Forecast history window (07_forecast_seasonal). The demo data has almost no claims in
# 2014-2019 and stops developing its claims after 2023-09, so its window is set here.
# Leave it out for real data: the window is then derived from the data.
forecast_window = ["2020-01", "2023-09"]

[profiles.oracle]
raw_dir     = "data/raw"            # warehouse extracts (git-ignored, never commit)
output_root = "data/real"           # results for Power BI (git-ignored)
models_dir  = "data/real/models"
reports_dir = "data/real/reports"

[data]
# Classes treated as motor business. Empty list = keep every class the extract returns.
motor_classes = ["Motor Private", "Motor Commercial", "Motor Rent a Car"]

[report]
# How many policy years Power BI loads, ending at the current year. The current year is worked out
# from the data (the last calendar year the claims reach to its end), so it moves forward on its own.
# The models always use the full history; only the dashboard is limited. Forecast months are kept.
years = 5
# What counts towards a year's figures.
#   "written_year" = only policies written in the year, their whole premium including what continues
#                    after the year; earlier policies still running are left out
#   "calendar"     = Forecast and Alerts use premium earned in the calendar months, from every policy
# [MANAGER DIRECTION, docs/TASK_PLAN.md decision 8] written_year is shown in the demo until the finance
# manager decides. year_basis_status is the flag the report shows; empty once approved.
year_basis = "written_year"
year_basis_status = "Needs finance manager approval"
# Flag shown on the alerts panel and the Optimal Price card for the method in [pricing] below; empty once approved.
method_review_status = "Needs manager review"

[zones]
# Offices whose name carries no city (online aggregators, e-commerce, telesales, outlets) are
# placed in this city's zone: the head office, per the team's office-location specification.
# Must be a city in pipeline/zone_mapping.py. dim_zone[LOCATION_BASIS] marks these offices.
default_office_city = "Riyadh"

[oracle]
# Connection details belong in config.local.toml, not here:
#   dsn  = "host:port/service_name"
#   user = "READONLY_USER"
# The password is never stored in a file: it is read from the environment variable
# AMAN_ORACLE_PASSWORD, or asked for when the extract runs.
sql_dir = "sql"               # one .sql file per extract (policies, claims, claims_dev_*)
vehicles_years = 7            # sql/vehicles.sql: the last N motor policy years (the vehicle view is slow:
                              # all history ran over an hour, 4 years ~7 minutes). Renewal needs ~2 years;
                              # the driver premium model (B1) needs ~6 to backtest renewals vs new business
first_policy_year = 0         # first policy year extracted; 0 = all history (the models learn from it all,
                              # Power BI shows only the last [report] years)
fetch_batch_rows = 50000

[prepare]
# How to estimate each claim's final (ultimate) cost from warehouse data.
#   "incurred" = paid + case reserve, no IBNR.  [ASSUMPTION — agree the method with the
#   manager/actuary; a chain-ladder option is a planned improvement]
ultimate_method = "incurred"
as_of_date = ""               # valuation date "YYYY-MM-DD"; empty = latest accident date in the claims extract

[pricing]
# [DECIDED FOR THE DEMO, NEEDS MANAGER REVIEW: docs/TASK_PLAN.md decision 9]
# Expected claims for the current year and for pricing.
#   "experience" = each segment's actual results, blended toward its class by credibility, times the
#                  bias-corrected trend factor from the forecast backtest
#   "model"      = the GLM's expected claims as they are
expected_claims = "experience"
# How the optimizer picks a price.
#   "reach_target" = smallest increase that reaches the target within the retention floor; no increase
#                    when already under target; the highest the floor allows when it cannot be reached
#   "max_profit"   = highest profit inside the retention floor and the technical price limit
selection_rule = "reach_target"
# Protected rating factors. [MANAGER DECISION — docs/TASK_PLAN.md decision 7] Whether gender and
# nationality may be used in pricing (regulation and fairness). Until decided, pricing uses the
# general rating factors only. Switching one on needs a GENDER / NATIONALITY column in the
# policy extract; the GLM refit stops with a message if it is missing.
use_gender      = false
use_nationality = false

[business]
# [ASSUMPTIONS — confirm with the manager; see docs/TASK_PLAN.md Task 1]
admin_expense_rate = 0.10     # admin expense as share of premium
risk_margin_rate   = 0.05     # prudence loading on expected claims (break-even)
target_combined_ratio = 0.95  # [decision 1] the one target: levers, optimizer, and the report's default

[credibility]
# [ASSUMPTIONS] docs/CREDIBILITY.md
full_claims = 30              # segment flag: Full at this many claims
partial_claims = 10           # segment flag: Partial
full_policies = 300           # pricing report: Full at this many policies
partial_policies = 50         # pricing report: Partial
full_standard_claims = 1082   # classical full-credibility standard, default of the report's slider
reliability_high = 0.70       # report wording: "You can rely on this result" at or above
reliability_low = 0.30        # below this a segment is a small book: at most a Warning

[safe_zone]
# Combined ratio bands of SAFE_ZONE_STATUS
green = 0.90
yellow = 1.00
red = 1.10

[levers]
# [ASSUMPTIONS] Path to Profitability sizes, share of premium or claims each lever can recover
reprice_cap = 0.50            # largest repricing lever
bonus_malus_share = 0.15      # share of claim frequency recoverable by surcharges
bonus_malus_cap = 0.05
uw_severity_reduction = 0.15  # preferred garages: reduction in repair cost
uw_realisation = 0.50         # share of it realised
claims_mgmt_recovery = 0.05   # share of claims recoverable by faster settlement
mix_share_of_gap = 0.10       # share of a Loss segment's gap closed by mix shift
glide_uw_share_month_9 = 0.60 # share of the UW lever reached by month 9 of the timeline

[optimizer]
# [PROVISIONAL, NEEDS MANAGER REVIEW 2026-11-11] Renewal at an unchanged price is measured per segment
# by step 17 (the same car insured again, chassis link; fact_renewal_rates.csv). baseline_renewal is
# only the fallback when there is no vehicle extract.
baseline_renewal = 0.90       # fallback chance of renewal at an unchanged price
# The sensitivity cases' k below were set against this renewal rate. k is rescaled to each segment's
# measured rate so customers react to price as strongly as before (k x (1 - renewal) held fixed).
price_reaction_reference_renewal = 0.90
risk_gamma = 0.5              # low-risk customers react more to price, high-risk less; 0 = off
target_margin = 0.05          # profit loading in the technical price
tech_tolerance = 0.05         # may price up to this many points above the technical change
# floor_basis: "relative" = a floor is the share of the customers who would renew at no change that a
# price keeps; "absolute" = share of the whole book. With a measured renewal of ~14%, absolute floors
# can never be met, so "relative" until the manager sets floors on the real renewal rate.
# The relative floors keep the old strictness: 80% and 85% of the book at an assumed 90% renewal let a
# price lose 11% and 6% of the renewers, i.e. keep 0.80/0.90 = 89% and 0.85/0.90 = 94% of them.
floor_basis = "relative"
retention_floor = 0.89        # segment
portfolio_retention_floor = 0.94
floor_sensitivity = [0.89, 0.91, 0.94, 0.96]   # relative floors compared in fact_floor_sensitivity
premium_change_min = -0.20
premium_change_max = 0.50
min_profit_improvement = 0.0
contraction_flag_threshold = 0.10
min_segment_policies = 30     # smaller segments take the price of their parent group

[optimizer.sensitivity_cases]
# Logit slope per +100% price change: bigger = customers more price sensitive
low = 3.0
base = 5.0
high = 8.0

[lines]
# Other lines of business (steps 20-21): credibility loss-ratio pricing; target and admin rate as [business].
experience_years = 5          # policy years of experience, up to the current year (years left out by step 20 skipped)
# A department's benchmark loss ratio from its market report, which thin classes lean on. Empty = none:
# the department's own experience is the complement and the price is marked low-confidence.
# benchmark_loss_ratio = { FGA = 0.55, Marine = 0.60 }
benchmark_loss_ratio = {}

[training]
# How many years of history the models learn from (pipeline/training_window.py). "auto": each model
# tests 3, 5, 7 years and all history on its own backtest and keeps the longest window within one
# standard error of the best, so every company gets a window that fits its data. A number of years or
# "all" overrides it. Power BI shows only the last [report] years either way.
window_years = "auto"

[forecast]
annual_growth_default = 0.0   # default of the Forecast page's "What-if: adjust the forecast" slider; 0 = the model's own forecast

[report_tiers]
# Wording tiers of the lever pages' action columns
reprice_urgent = -0.13        # pricing gap at or below: "Urgent reprice"
reprice_renewal = -0.03       # below: "Reprice at renewal"
reprice_over = 0.10           # at or above: "Overpriced"
bm_urgent = 0.20              # frequency above average by more than: "Urgent"
bm_renewal = 0.10
bm_reward = -0.05             # at or below: "Reward"
uw_mandatory = 0.20           # severity above average by more than: "Mandatory garage list"
uw_preferred = 0.05
uw_low = -0.10
cm_ibnr_high = 0.30
cm_ibnr = 0.15
cm_open_high = 0.50
cm_open = 0.30
high_severity_claim = 10000   # SAR: a "high-cost" claim

[variance]
# Underwriting P&L bridge: a variance is material if either threshold is exceeded
pct = 0.05                    # share of the No-change line
share_of_premium = 0.01       # share of No-change portfolio premium
ratio_pts = 1.0               # points, for ratio lines

[alerts_email]
# Step 16 emails the management alerts after a full run that passed the reconcile gate.
# [MANAGER DECISION, pending] who receives it, how often the pipeline runs, and when to send.
# The alerts are decided at target_combined_ratio above, not at the report's slider.
# How the email is sent (Microsoft 365 app, test address) is set per machine in config.local.toml [email].
enabled   = false             # true once the recipients are agreed
to        = []                # e.g. ["ceo@company.com", "pricing.manager@company.com"]
cc        = []
# The email shows only the alerts to act on now (step 15 PRIORITY 1), as the report's cards; the rest are in the report.
send_when = "if_any"          # "always" (also "No segment needs action now") | "if_any" | "if_critical"
# Fields: {act_now} {open} {critical} {warning} {cutoff}
subject   = "Management alerts: {act_now} to act on now · data to {cutoff}"

[reconcile]
# Step 13: two amounts agree within the larger of these
tolerance_sar = 1.0
tolerance_share = 0.00001     # 0.001% of the amount
