# Aman Prediction — pipeline configuration (committed; contains NO secrets)
#
# Personal / machine settings (Oracle address, username, a different output folder) go in
# config.local.toml next to this file. That file is git-ignored and overrides anything here.
# Copy config.local.example.toml to config.local.toml to start.
#
# Choose the data source per run:   python run_all.py --source oracle
# or set it here once:               [run] source = "oracle"

[run]
source = "synthetic"          # "synthetic" (demo Excel files) or "oracle" (company warehouse)

# Where each source writes its results. Power BI's DataFolder parameter must point at
# <output_root>\ (the folder that contains 02_facts and 03_dims).
[profiles.synthetic]
output_root = "SYNTHETIC_DSS_DATA"
models_dir  = "models"
reports_dir = "outputs"
# Forecast history window (07_forecast_seasonal). The demo data has almost no claims in
# 2014-2019 and stops developing its claims after 2023-09, so its window is set here.
# Leave it out for real data: the window is then derived from the data.
forecast_window = ["2020-01", "2023-09"]

[profiles.oracle]
raw_dir     = "data/raw"            # warehouse extracts (git-ignored, never commit)
output_root = "data/real"           # results for Power BI (git-ignored)
models_dir  = "data/real/models"
reports_dir = "data/real/reports"

[data]
# Classes treated as motor business. Empty list = keep every class the extract returns.
motor_classes = ["Motor Private", "Motor Commercial", "Motor Rent a Car"]

[report]
# How many policy years Power BI loads, ending at the current year. The current year is worked out
# from the data (the last calendar year the claims reach to its end), so it moves forward on its own.
# The models always use the full history; only the dashboard is limited. Forecast months are kept.
years = 5
# What counts towards a year's figures.
#   "written_year" = only policies written in the year, their whole premium including what continues
#                    after the year; earlier policies still running are left out
#   "calendar"     = Forecast and Alerts use premium earned in the calendar months, from every policy
# [MANAGER DIRECTION, docs/TASK_PLAN.md decision 8] written_year is shown in the demo until the finance
# manager decides. year_basis_status is the flag the report shows; empty once approved.
year_basis = "written_year"
year_basis_status = "Needs finance manager approval"
# Flag shown on the alerts panel and the Optimal Price card for the method in [pricing] below; empty once approved.
method_review_status = "Needs manager review"

[zones]
# Offices whose name carries no city (online aggregators, e-commerce, telesales, outlets) are
# placed in this city's zone: the head office, per the team's office-location specification.
# Must be a city in pipeline/zone_mapping.py. dim_zone[LOCATION_BASIS] marks these offices.
default_office_city = "Riyadh"

[oracle]
# Connection details belong in config.local.toml, not here:
#   dsn  = "host:port/service_name"
#   user = "READONLY_USER"
# The password is never stored in a file: it is read from the environment variable
# AMAN_ORACLE_PASSWORD, or asked for when the extract runs.
sql_dir = "sql"               # one .sql file per extract (policies, claims, claims_dev_*)
fetch_batch_rows = 50000

[prepare]
# How to estimate each claim's final (ultimate) cost from warehouse data.
#   "incurred" = paid + case reserve, no IBNR.  [ASSUMPTION — agree the method with the
#   manager/actuary; a chain-ladder option is a planned improvement]
ultimate_method = "incurred"
as_of_date = ""               # valuation date "YYYY-MM-DD"; empty = date of the extract

[pricing]
# [DECIDED FOR THE DEMO, NEEDS MANAGER REVIEW: docs/TASK_PLAN.md decision 9]
# Expected claims for the current year and for pricing.
#   "experience" = each segment's actual results, blended toward its class by credibility, times the
#                  bias-corrected trend factor from the forecast backtest
#   "model"      = the GLM's expected claims as they are
expected_claims = "experience"
# How the optimizer picks a price.
#   "reach_target" = smallest increase that reaches the target within the retention floor; no increase
#                    when already under target; the highest the floor allows when it cannot be reached
#   "max_profit"   = highest profit inside the retention floor and the technical price limit
selection_rule = "reach_target"
# Protected rating factors. [MANAGER DECISION — docs/TASK_PLAN.md decision 7] Whether gender and
# nationality may be used in pricing (regulation and fairness). Until decided, pricing uses the
# general rating factors only. Switching one on needs a GENDER / NATIONALITY column in the
# policy extract; the GLM refit stops with a message if it is missing.
use_gender      = false
use_nationality = false

[business]
# [ASSUMPTIONS — confirm with the manager; see docs/TASK_PLAN.md Task 1]
admin_expense_rate = 0.10     # admin expense as share of premium
risk_margin_rate   = 0.05     # prudence loading on expected claims (break-even)
